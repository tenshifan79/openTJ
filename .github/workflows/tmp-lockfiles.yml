# Temporary: regenerates the lockfiles for the dependency bumps on this branch.
# Removed again before the pull request is opened.
name: tmp-lockfiles
on:
  push:
    branches: [director-deploy]
    paths: [".github/workflows/tmp-lockfiles.yml"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.9.0"
      - run: |
          npm install --package-lock-only --ignore-scripts --engine-strict
          npm update source-map-js --package-lock-only --ignore-scripts --engine-strict
          (cd deployment/tasks && npm install --package-lock-only --ignore-scripts --engine-strict)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json deployment/tasks/package-lock.json
          git commit -m "Regenerate lockfiles for the dependency bumps"
          git pull --rebase origin director-deploy
          git push origin HEAD:director-deploy
